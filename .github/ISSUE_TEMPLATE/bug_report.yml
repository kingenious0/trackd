name: Bug report
description: Create a report to help us improve Trackd
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue! Please do not disclose private credentials, phone numbers, or PINs here.
  - type: input
    id: version
    attributes:
      label: Trackd Version
      description: What version of Trackd are you using? (e.g., v1.2.6)
      placeholder: v1.2.6
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & Android Version
      description: What phone model and Android version are you running? (e.g. Samsung Galaxy A14, Android 14 One UI 6)
      placeholder: Samsung Galaxy A14 / Android 14
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      value: |
        1. Open Trackd
        2. Tap on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
