name: Feature request
description: Suggest an idea or enhancement for Trackd
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for contributing ideas to make Trackd safer and more resilient!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation you encountered.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've evaluated.
    validations:
      required: false
